# Vox AI Input 配置模板
# 复制此文件为 config.yaml，按需配置本地转写和 AI 润色

# 转写引擎设置
stt:
    # 后端固定为本地离线
    backend: "local"
    # 本地模型类型:
    #   sense_voice（推荐·中文最佳）
    #   whisper_small（多语言通用）
    #   paraformer_streaming（中英实时转写，选择后自动启用流式）
    model_type: "sense_voice"

# 录音设置
recording:
    # 采样率（Hz）
    sample_rate: 16000
    # 声道数（1=单声道）
    channels: 1
    # 最大录音时长（秒），超过自动停止
    max_duration: 60

# 热键设置
hotkey:
    # 长按触发录音的快捷键
    # macOS: ctrl+shift+space
    # Windows: ctrl+shift+space
    combination: "alt+z"

# 润色设置
polish:
    # 是否启用 AI 润色（false 则直接输出本地转写原文）
    enabled: false
    # 润色使用的 LLM profile；设置窗口会自动使用 default
    profile: "default"
    # 翻译目标语言（留空=不翻译）
    # 可选值: zh(简体中文) en(英语) ja(日语) ko(韩语) fr(法语) de(德语) es(西班牙语) ru(俄语) zh-TW(繁体中文)
    translate_to: ""
    # 翻译时是否同时输出原文（true=先原文再译文，false=只输出译文）
    show_original: false

# 文字润色/翻译模型配置
# 设置窗口只需要填写 endpoint、api_key、model，然后点击“验证并识别”。
# provider 可省略或设为 auto；验证成功后会自动识别为 openai_compatible / azure_openai / anthropic。
llm_profiles:
    default:
        provider: "auto"
        endpoint: ""
        api_key: ""
        model: ""

# 历史记录
history:
    # 保存最近输出，便于在设置窗口回看和复制
    enabled: true
    # 最多保留多少条历史记录（JSONL 文件自动裁剪）
    max_entries: 100
